[package]
name = "provenance-log"
version = "2.1.0"
edition = "2021"
rust-version = "1.95"
authors = ["Dave Grantham <dwg@linuxprogrammer.org>"]
description = "Programmable cryptographic provenance logs"
repository = "https://github.com/cryptidtech/provenance-log.git"
readme = "README.md"
keywords = ["provenance", "provenance-logs", "multiformats"]
categories = ["cryptography", "data-structures"]
license = "FSL-1.1-Apache-2.0"

[features]
default = ["serde", "dag_cbor"]
dag_cbor = ["dep:multi-cbor", "multi-cbor/tags", "multi-cid/dag_cbor", "multi-vlad/dag_cbor"]
# Slow tests (run with `cargo test --features slow-tests`). These take more
# than 30 seconds and are excluded from the default `cargo test` run.
slow-tests = []

[dependencies]
log = "0.4"
multi-base = { version = "1.0", default-features = false }
multi-cbor = { version = "0.1", optional = true }
multi-cid = "0.2"
multi-codec = "1.2"
multi-hash = "1.1"
multi-key = "1.1"
multi-sig = "1.2"
multi-trait = { version = "1.0", default-features = false }
multi-util = "1.1"
multi-vlad = "0.1"
once_cell = "1.19"
thiserror = "2.0"
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"], optional = true }
wacc = "2.0"
# These use package rename to bs-* workspace path deps until Phases 7-9
# publish the Lamport/XMSS support to crates.io.
wasmtime = { version = "47.0", default-features = false, features = [
    "cranelift",
    "parallel-compilation",
    "runtime",
    "std",
    "wat",
] }

[dev-dependencies]
criterion = "0.8"
hex = "0.4"
multi-cbor = "0.1"
proptest = "1.11"
rand_010 = { package = "rand", version = "0.10" }
serde_json = "1.0"
serde_test = "1.0"
test-log = { version = "0.2", features = ["trace", "color"] }

[[bench]]
name = "provenance-log_bench"
harness = false
path = "benches/provenance-log_bench.rs"

[[bin]]
name = "lipmaa"
path = "src/bin/lipmaa.rs"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = { level = "allow", priority = 1 }

[package]
name = "provenance-log"
version = "2.0.0"
edition = "2021"
rust-version = "1.85"
authors = ["Dave Grantham <dwg@linuxprogrammer.org>"]
description = "Programmable cryptographic provenance logs"
repository = "https://github.com/cryptidtech/provenance-log.git"
readme = "README.md"
keywords = ["provenance", "provenance-logs", "multiformats"]
categories = ["cryptography", "data-structures"]
license = "FSL-1.1-Apache-2.0"

[features]
default = ["serde", "dag_cbor"]
dag_cbor = ["dep:multi-cbor", "multi-cbor/tags", "multi-cid/dag_cbor", "multi-vlad/dag_cbor"]

[dependencies]
log = "0.4"
once_cell = "1.19"
rand = "0.8"
thiserror = "2.0"
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"], optional = true }
multi-cbor = { version = "0.1", path = "../multi-cbor", optional = true }
multi-cid = { version = "0.1", path = "../multi-cid" }
multi-vlad = { version = "0.1", path = "../multi-vlad" }
wacc = { path = "../wacc" }
# These use package rename to bs-* workspace path deps until Phases 7-9
# publish the Lamport/XMSS support to crates.io.
multi-base = { package = "bs-multibase", version = "0.7.0", path = "../bettersign/crates/multibase", default-features = false }
multi-codec = { package = "bs-multicodec", version = "0.7.0", path = "../bettersign/crates/multicodec" }
multi-hash = { package = "bs-multihash", version = "0.7.0", path = "../bettersign/crates/multihash" }
multi-key = { package = "bs-multikey", version = "0.7.0", path = "../bettersign/crates/multikey" }
multi-sig = { package = "bs-multisig", version = "0.7.0", path = "../bettersign/crates/multisig" }
multi-trait = { package = "bs-multitrait", version = "0.7.0", path = "../bettersign/crates/multitrait", default-features = false }
multi-util = { package = "bs-multiutil", version = "0.7.0", path = "../bettersign/crates/multiutil" }
wasmtime = { version = "41.0", default-features = false, features = [
    "cranelift",
    "parallel-compilation",
    "runtime",
    "std",
    "wat",
] }

[dev-dependencies]
criterion = "0.8"
hex = "0.4"
multi-cbor = { version = "0.1", path = "../multi-cbor" }
proptest = "1.4"
rand_010 = { package = "rand", version = "0.10" }
serde_json = "1.0"
serde_test = "1.0"
test-log = { version = "0.2", features = ["trace", "color"] }

[[bench]]
name = "provenance-log_bench"
harness = false
path = "benches/provenance-log_bench.rs"

[[bin]]
name = "lipmaa"
path = "src/bin/lipmaa.rs"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = { level = "allow", priority = 1 }